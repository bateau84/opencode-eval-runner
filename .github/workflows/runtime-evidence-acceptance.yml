name: Provider-free runtime evidence acceptance

on:
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - 'runner/**'
      - 'tests/integration/**'
      - 'tests/test_runtime_evidence_acceptance.py'
      - '.github/workflows/runtime-evidence-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check acceptance driver
        run: |
          python3 -m py_compile tests/integration/run_runtime_evidence_acceptance.py
          python3 -m unittest discover -s tests -p 'test_runtime_evidence_acceptance.py' -v

      - name: Build stock OpenCode 2.0.23 runner image
        run: docker build -f Containerfile --target opencode -t opencode-eval-runner:runtime-evidence-acceptance .

      - name: Run provider-free acceptance gate
        run: |
          python3 tests/integration/run_runtime_evidence_acceptance.py \
            --image opencode-eval-runner:runtime-evidence-acceptance \
            --output runtime-evidence-acceptance

      - name: Preserve sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime-evidence-acceptance/
          if-no-files-found: error
          retention-days: 14
