name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transport:
          - opencode
          - copilot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bateau84/opencode-eval-runner
          tags: |
            type=raw,value=${{ matrix.transport }}-edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.transport }}-sha-
            type=ref,event=tag,prefix=${{ matrix.transport }}-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.transport }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
