name: Stock native observer integration

on:
  pull_request:
    paths:
      - 'container/invoke.py'
      - 'container/native_observer.py'
      - 'container/native_observer.ts'
      - 'tests/integration/native_observer_probe.ts'
      - 'tests/integration/run_native_observer_probe.py'
      - 'tests/test_native_observer.py'
      - '.github/workflows/native-observer-integration.yml'

permissions:
  contents: read

jobs:
  stock-native-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify probe syntax
        run: python3 -m py_compile container/native_observer.py tests/integration/run_native_observer_probe.py

      - name: Build runner with stock OpenCode 2.0.23
        run: docker build -f Containerfile --target opencode -t opencode-eval-runner:native-observer-probe .

      - name: Run provider-free native observer probe
        run: |
          docker run --rm             --network none             --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777             --tmpfs /workspace:rw,nosuid,nodev,size=64m,mode=1777             --volume "$PWD:/probe-repo:ro"             --entrypoint python3             opencode-eval-runner:native-observer-probe             /probe-repo/tests/integration/run_native_observer_probe.py             > native-observer-probe.json
          cat native-observer-probe.json

      - name: Preserve probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-observer-${{ github.event.pull_request.head.sha }}
          path: native-observer-probe.json
          if-no-files-found: warn
          retention-days: 14
