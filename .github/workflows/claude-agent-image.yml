name: Claude Agent image (no inference)

on:
  pull_request:
    paths:
      - Containerfile
      - runner/oci_image.py
      - runner/cli.py
      - container/invoke.py
      - .github/workflows/claude-agent-image.yml
  push:
    branches: [main]
    paths:
      - Containerfile
      - runner/oci_image.py
      - runner/cli.py
      - container/invoke.py
      - .github/workflows/claude-agent-image.yml

permissions:
  contents: read

jobs:
  image:
    name: Build and inspect pinned Claude Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Build exact image without credentials
        run: docker build --pull -f Containerfile --target claude-agent -t eval-claude-agent:candidate .
      - name: Verify image and official executables without provider requests
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect eval-claude-agent:candidate --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "2.2.6"
          test "$(docker image inspect eval-claude-agent:candidate --format '{{index .Config.Labels "io.opencode-eval-runner.claude-version"}}')" = "2.1.318"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --entrypoint /bin/sh eval-claude-agent:candidate -ec '
              case "$(opencode --version)" in
                "2.2.6"|"opencode v2.2.6") ;;
                *) exit 14 ;;
              esac
              claude --version | grep -F "2.1.318"
            '

      - name: Verify native external integration activation (no credentials, no inference)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --tmpfs /workspace:rw,nosuid,nodev,size=64m,mode=1777 \
            --volume "$PWD/tests/fixtures/models-catalog.json:/seed/models.json:ro" \
            --entrypoint python3 eval-claude-agent:candidate - <<'PY'
          import sys
          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import (
              _start_preflight_server, _standalone_json_request,
              _stop_preflight_server, prepare_opencode_env, unwrap_api_data,
          )

          env = prepare_opencode_env()
          env["CLAUDE_CONFIG_DIR"] = "/tmp/claude-test-no-login"
          env["OPENCODE_CLAUDE_PATH"] = "/usr/local/bin/claude"
          server, url, auth = _start_preflight_server(env, 40)
          try:
              def request(path, method="GET", payload=None):
                  return unwrap_api_data(_standalone_json_request(
                      url, path, method=method, payload=payload,
                      authorization=auth, timeout=35,
                  ))
              session = request("/api/session", "POST", {
                  "title": "no-inference native integration test",
                  "location": {"directory": "/workspace"},
              })
              assert isinstance(session.get("id"), str), "no session"
              request("/api/session/" + session["id"] + "/prompt",
                      "POST", {"text": "activate plugins without inference", "resume": False})
              integration = request("/api/integration/claude-agent")
              assert integration["id"] == "claude-agent", integration
              assert any(method["id"] == "claude-login" and method["type"] == "external"
                         for method in integration["methods"]), integration
              assert not integration["connections"], "unexpected inherited credential connection"
              request("/api/integration/claude-agent/connect/external",
                      "POST", {"methodID": "claude-login"})
              connected = request("/api/integration/claude-agent")
              assert connected["connections"], "native connection was not persisted"
              print("PASS native external connection registered with no model prompt")
          finally:
              _stop_preflight_server(server)
          PY
