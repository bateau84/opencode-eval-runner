name: Claude Agent image (no inference)

on:
  pull_request:
    paths:
      - Containerfile
      - runner/oci_image.py
      - runner/cli.py
      - container/invoke.py
      - .github/workflows/claude-agent-image.yml
  push:
    branches: [main]
    paths:
      - Containerfile
      - runner/oci_image.py
      - runner/cli.py
      - container/invoke.py
      - .github/workflows/claude-agent-image.yml

permissions:
  contents: read

jobs:
  image:
    name: Build and inspect pinned Claude Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Build exact image without credentials
        run: docker build --pull -f Containerfile --target claude-agent -t eval-claude-agent:candidate .
      - name: Verify image and official executables without provider requests
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect eval-claude-agent:candidate --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "2.2.6"
          test "$(docker image inspect eval-claude-agent:candidate --format '{{index .Config.Labels "io.opencode-eval-runner.claude-version"}}')" = "2.1.318"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --entrypoint /bin/sh eval-claude-agent:candidate -ec '
              case "$(opencode --version)" in
                "2.2.6"|"opencode v2.2.6") ;;
                *) exit 14 ;;
              esac
              claude --version | grep -F "2.1.318"
            '
