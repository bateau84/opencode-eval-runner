name: Protected runtime channel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - protected-runtime/**
      - runner/protected.py
      - runner/protected_launch.py
      - bin/opencode-eval-runner
      - tests/integration/protected_tools.py
      - tests/integration/test_protected_connection.py
      - tests/test_review_accounting.py
      - tests/test_workflow_boundaries.py
      - tests/test_protected.py
      - .github/workflows/protected-channel.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python tests and provenance
        run: |
          mkdir -p protected-results
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee protected-results/unit-tests.txt
          python3 -m py_compile protected-runtime/invoke.py tests/integration/test_protected_connection.py
          git rev-parse HEAD > protected-results/checkout.txt
          sha256sum runner/protected.py runner/protected_launch.py protected-runtime/*.py protected-runtime/*.ts protected-runtime/Containerfile tests/integration/protected_tools.py tests/integration/test_protected_connection.py > protected-results/sources.sha256
      - name: Build images without registry credentials
        run: |
          for target in protected fixture-tools; do
            docker build -f protected-runtime/Containerfile --target "$target" --build-arg RUNNER_REVISION="$(git rev-parse HEAD)" -t "pr41-${target}:build" .
          done
          docker save -o images.tar pr41-protected:build pr41-fixture-tools:build
      - name: Preserve source and build evidence
        if: always()
        run: git archive --format=tar HEAD > protected-results/tested-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protected-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected-results/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-image-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: images.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      runtime: ${{ steps.images.outputs.protected }}
      tools: ${{ steps.images.outputs.fixture-tools }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-image-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-data
      # No checkout, build, tests, or image execution on this privileged runner.
      # Publication identifies experimental bytes; it does not approve their safety.
      - name: Publish fixed image destinations from archive data
        id: images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir publication
          docker load --input image-data/images.tar
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for target in protected fixture-tools; do
            tag="ghcr.io/bateau84/opencode-eval-runner:pr41-${target}-${HEAD_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker tag "pr41-${target}:build" "$tag"
            docker push "$tag" | tee "publication/${target}-publish.txt"
            image="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$image" =~ ^ghcr\.io/bateau84/opencode-eval-runner@sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$image" > "publication/${target}-image.txt"
            printf '%s=%s\n' "$target" "$image" >> "$GITHUB_OUTPUT"
            docker image inspect "$image" > "publication/${target}-inspect.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected-results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected-results
      - name: Real runtime to host importer, target attacks and transport faults
        env:
          RUNTIME_IMAGE: ${{ needs.publish.outputs.runtime }}
          TOOL_IMAGE: ${{ needs.publish.outputs.tools }}
        run: |
          python3 tests/integration/test_protected_connection.py --image "$RUNTIME_IMAGE" --tool-image "$TOOL_IMAGE" --output protected-results/connection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protected-channel-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: protected-results/
          retention-days: 14
          if-no-files-found: error
