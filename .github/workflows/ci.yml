name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python checks
        run: |
          python3 -m compileall -q runner container tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build fake Copilot transport for action smoke test
        run: |
          cat > /tmp/Containerfile.fake-copilot <<'EOF'
          FROM alpine:3.22
          ENTRYPOINT ["/bin/sh", "-c", "if [ -z \"$GITHUB_TOKEN\" ] || [ -n \"$COPILOT_GITHUB_TOKEN\" ] || [ -n \"$GH_TOKEN\" ] || [ \"$EVAL_REASONING\" != \"medium\" ]; then exit 42; fi; printf '%s\\n' '{\"schema\":\"opencode-eval-runner/v1\",\"transport\":\"github-copilot-cli\",\"model\":\"fake\",\"reasoning\":\"medium\",\"reasoning_source\":\"explicit\",\"agent\":\"eval-runner\",\"skill\":null,\"exit_code\":0,\"session_id\":null,\"text\":\"fake action smoke\",\"tools\":[],\"actions\":[],\"skills_loaded\":[],\"stderr\":\"\",\"stdout\":\"\",\"runtime_evidence\":{\"schema\":\"opencode-eval-runner/runtime-evidence/v1\",\"status\":\"unsupported\",\"evidence_eligible\":false,\"observations\":[],\"coverage\":{\"observation_closed\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"process_state\":\"unsupported\",\"starts\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"missing_terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"observer_failures\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"callback_failures\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"losses\":[],\"unsupported\":[\"observer_not_implemented\"],\"boundaries\":{\"native\":{\"status\":\"unsupported\",\"evidence_eligible\":false,\"starts\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"missing_terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"issues\":[\"observer_not_implemented\"]},\"code_mode_execution\":{\"status\":\"unsupported\",\"evidence_eligible\":false,\"starts\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"missing_terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"issues\":[\"observer_not_implemented\"]},\"code_mode_finality\":{\"status\":\"unsupported\",\"evidence_eligible\":false,\"starts\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"missing_terminals\":{\"state\":\"unsupported\",\"reason\":\"observer_not_implemented\"},\"issues\":[\"observer_not_implemented\"]}}}}}'"]
          EOF
          docker build -f /tmp/Containerfile.fake-copilot -t opencode-eval-runner:fake-copilot /tmp
          printf '%s\n' 'action smoke prompt' > /tmp/action-smoke-prompt.txt

      - name: Exercise direct GitHub Action token path
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: should-not-win
          GH_TOKEN: should-not-win
        with:
          engine: docker
          prepare-opencode: false
          prepare-copilot: false
          copilot-image: opencode-eval-runner:fake-copilot
          transport: github-copilot-cli
          model: fake
          reasoning: medium
          prompt-file: /tmp/action-smoke-prompt.txt
          output: /tmp/action-smoke-result.json

      - name: Exercise repository command token sanitization
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: should-not-win
          GH_TOKEN: should-not-win
        with:
          prepare-opencode: false
          prepare-copilot: false
          command: test -n "$GITHUB_TOKEN" && test -z "$COPILOT_GITHUB_TOKEN" && test -z "$GH_TOKEN"

      - name: Verify direct action result
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/action-smoke-result.json", encoding="utf-8"))
          assert result["exit_code"] == 0
          assert result["transport"] == "github-copilot-cli"
          assert result["reasoning"] == "medium"
          assert result["reasoning_source"] == "explicit"
          assert result["text"] == "fake action smoke"
          assert result["runtime_evidence"]["status"] == "unsupported"
          assert result["runtime_evidence"]["evidence_eligible"] is False
          PY

  runtime-integration:
    name: runtime-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide runtime integration applicability
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "copilot=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: run full runtime integration."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          runtime=false
          copilot=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            printf 'changed: %s\n' "$path"

            case "$path" in
              Containerfile|action.yml|bin/*|container/*|runner/*|tests/integration/*|tests/test_invoke.py|tests/test_evidence_safety.py|tests/test_native_observer.py|tests/test_runtime_evidence.py|tests/test_runtime_evidence_acceptance.py|.github/workflows/ci.yml)
                runtime=true
                ;;
            esac

            case "$path" in
              Containerfile|action.yml|bin/*|container/*|runner/*|.github/workflows/ci.yml)
                copilot=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "copilot=$copilot" >> "$GITHUB_OUTPUT"

      - name: Runtime integration not applicable
        if: steps.changes.outputs.runtime != 'true'
        run: echo "No runtime-relevant files changed; runtime integration is not applicable."

      - name: Prepare integration artifacts
        if: steps.changes.outputs.runtime == 'true'
        run: mkdir -p runtime-integration-artifacts

      - name: Build stock OpenCode 2.0.23 image
        if: steps.changes.outputs.runtime == 'true'
        run: docker build -f Containerfile --target opencode -t opencode-eval-runner:opencode-test .

      - name: Verify pinned OpenCode runtime
        if: steps.changes.outputs.runtime == 'true'
        run: |
          version="$(docker run --rm --entrypoint opencode opencode-eval-runner:opencode-test --version)"
          printf 'OpenCode version: %s\n' "$version"
          test "$version" = "2.0.23"
          docker run --rm --entrypoint opencode opencode-eval-runner:opencode-test run --help             | grep -F -- 'provider/model#variant'

      - name: Run provider-free native observer probe
        if: steps.changes.outputs.runtime == 'true'
        run: |
          docker run --rm             --network none             --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777             --tmpfs /workspace:rw,nosuid,nodev,size=64m,mode=1777             --volume "$PWD:/probe-repo:ro"             --entrypoint python3             opencode-eval-runner:opencode-test             /probe-repo/tests/integration/run_native_observer_probe.py             > runtime-integration-artifacts/native-observer-probe.json
          cat runtime-integration-artifacts/native-observer-probe.json

      - name: Run stock Code Mode capability probe
        if: steps.changes.outputs.runtime == 'true'
        run: |
          python3 tests/integration/run_code_mode_observer_probe.py             --image opencode-eval-runner:opencode-test             --output runtime-integration-artifacts/code-mode-observer-probe

      - name: Run provider-free runtime evidence acceptance
        if: steps.changes.outputs.runtime == 'true'
        run: |
          python3 tests/integration/run_runtime_evidence_acceptance.py             --image opencode-eval-runner:opencode-test             --output runtime-integration-artifacts/runtime-evidence-acceptance

      - name: Smoke test OpenCode plugin activation preflight
        if: steps.changes.outputs.runtime == 'true'
        run: |
          rm -rf /tmp/preflight-workspace /tmp/preflight-config-root
          mkdir -p /tmp/preflight-workspace
          mkdir -p /tmp/preflight-config-root/plugins/loom
          cat > /tmp/preflight-config-root/plugins/loom/index.ts <<'EOF'
          export default {
            id: "loom",
            async setup() {},
          }
          EOF

          docker run --rm             --workdir /workspace             --volume /tmp/preflight-workspace:/workspace:ro             --volume /tmp/preflight-config-root:/seed/opencode-config:ro             --entrypoint python3             opencode-eval-runner:opencode-test - <<'PY'
          import sys

          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import prepare_opencode_env, verify_expected_plugin

          env = prepare_opencode_env()
          result = verify_expected_plugin(
              env,
              "general",
              "openai/preflight-no-inference",
              "loom",
              30,
          )
          assert result["plugin"]["id"] == "loom", result
          assert result["plugin"]["state"]["status"] == "active", result
          assert result["verification"] == "plugin-entrypoint+activation-barrier+plugin-inventory", result
          print("PASS OpenCode plugin activation preflight")
          PY

      - name: Smoke test config plugin workspace dependency resolution
        if: steps.changes.outputs.runtime == 'true'
        run: |
          rm -rf /tmp/plugin-workspace /tmp/plugin-config-root
          mkdir -p /tmp/plugin-workspace/node_modules/fixture-dep
          mkdir -p /tmp/plugin-config-root/plugins/loom

          cat > /tmp/plugin-workspace/node_modules/fixture-dep/package.json <<'EOF'
          {
            "name": "fixture-dep",
            "version": "1.0.0",
            "type": "module",
            "exports": "./index.js"
          }
          EOF
          cat > /tmp/plugin-workspace/node_modules/fixture-dep/index.js <<'EOF'
          export const marker = "resolved-from-workspace-node-modules"
          EOF
          cat > /tmp/plugin-config-root/plugins/loom/index.ts <<'EOF'
          import { writeFileSync } from "node:fs"
          import { marker } from "fixture-dep"

          writeFileSync("/tmp/config-plugin-loaded", marker)
          export default async () => ({})
          EOF

          docker run --rm             --volume /tmp/plugin-workspace:/workspace:ro             --volume /tmp/plugin-config-root:/seed/opencode-config:ro             --entrypoint python3             opencode-eval-runner:opencode-test - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import prepare_opencode_env

          env = prepare_opencode_env()
          bridge = Path(env["OPENCODE_CONFIG_DIR"]) / "node_modules"
          if not bridge.is_symlink():
              raise SystemExit(f"config dependency bridge missing: {bridge}")

          proc = subprocess.run(
              ["opencode", "api", "--standalone", "GET", "/experimental/tool/ids"],
              cwd="/workspace",
              env=env,
              capture_output=True,
              text=True,
              timeout=30,
              check=False,
          )
          marker = Path("/tmp/config-plugin-loaded")
          if not marker.is_file():
              raise SystemExit(
                  "config-root plugin did not load with workspace dependency; "
                  f"exit={proc.returncode} stdout={proc.stdout!r} stderr={proc.stderr!r}"
              )
          value = marker.read_text(encoding="utf-8")
          if value != "resolved-from-workspace-node-modules":
              raise SystemExit(f"unexpected dependency marker: {value!r}")
          print("PASS config-root plugin dependency bridge")
          PY

      - name: Build real Copilot image
        if: steps.changes.outputs.runtime == 'true' && steps.changes.outputs.copilot == 'true'
        run: docker build -f Containerfile --target copilot -t opencode-eval-runner:copilot-test .

      - name: Verify pinned Copilot runtime
        if: steps.changes.outputs.runtime == 'true' && steps.changes.outputs.copilot == 'true'
        run: |
          docker run --rm --entrypoint copilot opencode-eval-runner:copilot-test --version
          docker run --rm --entrypoint copilot opencode-eval-runner:copilot-test --help             | grep -F -- '--effort'

      - name: Report image sizes
        if: steps.changes.outputs.runtime == 'true'
        run: |
          docker image inspect opencode-eval-runner:opencode-test --format 'OpenCode image: {{.Size}} bytes'
          if [[ "${{ steps.changes.outputs.copilot }}" == "true" ]]; then
            docker image inspect opencode-eval-runner:copilot-test --format 'Copilot image: {{.Size}} bytes'
          fi

      - name: Preserve runtime integration reports
        if: always() && steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime-integration-artifacts/
          if-no-files-found: warn
          retention-days: 14
