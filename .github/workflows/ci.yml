name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python checks
        run: |
          python3 -m py_compile runner/cli.py container/invoke.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build fake Copilot transport for action smoke test
        run: |
          cat > /tmp/Containerfile.fake-copilot <<'EOF'
          FROM alpine:3.22
          ENTRYPOINT ["/bin/sh", "-c", "if [ -z \"$GITHUB_TOKEN\" ] || [ -n \"$COPILOT_GITHUB_TOKEN\" ] || [ -n \"$GH_TOKEN\" ]; then exit 42; fi; printf '%s\\n' '{\"schema\":\"opencode-eval-runner/v1\",\"transport\":\"github-copilot-cli\",\"model\":\"fake\",\"agent\":\"eval-runner\",\"skill\":null,\"exit_code\":0,\"session_id\":null,\"text\":\"fake action smoke\",\"tools\":[],\"actions\":[],\"skills_loaded\":[],\"stderr\":\"\",\"stdout\":\"\"}'"]
          EOF
          docker build -f /tmp/Containerfile.fake-copilot -t opencode-eval-runner:fake-copilot /tmp
          printf '%s\n' 'action smoke prompt' > /tmp/action-smoke-prompt.txt

      - name: Exercise direct GitHub Action token path
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: should-not-win
          GH_TOKEN: should-not-win
        with:
          engine: docker
          prepare-opencode: false
          prepare-copilot: false
          copilot-image: opencode-eval-runner:fake-copilot
          transport: github-copilot-cli
          model: fake
          prompt-file: /tmp/action-smoke-prompt.txt
          output: /tmp/action-smoke-result.json

      - name: Exercise repository command token sanitization
        uses: ./
        env:
          COPILOT_GITHUB_TOKEN: should-not-win
          GH_TOKEN: should-not-win
        with:
          prepare-opencode: false
          prepare-copilot: false
          command: test -n "$GITHUB_TOKEN" && test -z "$COPILOT_GITHUB_TOKEN" && test -z "$GH_TOKEN"

      - name: Verify direct action result
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/action-smoke-result.json", encoding="utf-8"))
          assert result["exit_code"] == 0
          assert result["transport"] == "github-copilot-cli"
          assert result["text"] == "fake action smoke"
          PY

      - name: Build OpenCode transport image
        run: docker build -f Containerfile --target opencode -t opencode-eval-runner:opencode-test .

      - name: Build Copilot transport image
        run: docker build -f Containerfile --target copilot -t opencode-eval-runner:copilot-test .

      - name: Smoke test OpenCode standalone tool registry
        run: |
          docker run --rm --entrypoint python3 opencode-eval-runner:opencode-test - <<'PY'
          import json
          import subprocess

          proc = subprocess.run(
              ["opencode", "api", "--standalone", "GET", "/experimental/tool/ids"],
              cwd="/tmp",
              capture_output=True,
              text=True,
              timeout=30,
              check=False,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  f"tool registry command failed ({proc.returncode}): {proc.stderr or proc.stdout}"
              )
          try:
              payload = json.loads(proc.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"tool registry command did not return JSON: {exc}; "
                  f"stdout={proc.stdout!r}; stderr={proc.stderr!r}"
              ) from exc

          data = payload.get("data") if isinstance(payload, dict) and "data" in payload else payload
          if not isinstance(data, list):
              raise SystemExit(f"tool registry payload is not a list: {payload!r}")
          print(f"PASS standalone tool registry ({len(data)} tools)")
          PY

      - name: Verify pinned tools
        run: |
          docker run --rm --entrypoint opencode opencode-eval-runner:opencode-test --version
          docker run --rm --entrypoint copilot opencode-eval-runner:copilot-test --version

      - name: Report image sizes
        run: |
          docker image inspect opencode-eval-runner:opencode-test --format 'OpenCode image: {{.Size}} bytes'
          docker image inspect opencode-eval-runner:copilot-test --format 'Copilot image: {{.Size}} bytes'
