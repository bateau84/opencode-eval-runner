name: OpenCode Eval Runner
description: Run isolated OpenCode or GitHub Copilot behavioral eval invocations, or set up the runner for a repository-owned eval harness.
author: bateau84

inputs:
  opencode-image:
    description: OCI image used for OpenCode transport invocations.
    required: false
    default: ghcr.io/bateau84/opencode-eval-runner:opencode-edge
  copilot-image:
    description: OCI image used for GitHub Copilot CLI transport invocations.
    required: false
    default: ghcr.io/bateau84/opencode-eval-runner:copilot-edge
  prepare-opencode:
    description: Pull/build the OpenCode transport image.
    required: false
    default: "true"
  prepare-copilot:
    description: Pull/build the GitHub Copilot CLI transport image.
    required: false
    default: "true"
  engine:
    description: Container engine used by eval invocations.
    required: false
    default: docker
  build:
    description: Build transport images from this action checkout instead of pulling published images.
    required: false
    default: "false"
  transport:
    description: Direct-invocation transport. Ignored when command is supplied.
    required: false
    default: opencode
  model:
    description: Direct-invocation model. When set and command is empty, the action runs one isolated invocation.
    required: false
    default: ""
  reasoning:
    description: Optional reasoning level. OpenCode maps this to its model variant; Copilot maps it to reasoning effort. Empty uses the provider default.
    required: false
    default: ""
  agent:
    description: Optional OpenCode agent for direct invocation.
    required: false
    default: ""
  skill:
    description: Optional OpenCode skill under test for direct invocation.
    required: false
    default: ""
  workspace:
    description: Workspace mounted into the direct invocation.
    required: false
    default: .
  workspace-mode:
    description: Workspace mount mode for direct invocation (ro or rw).
    required: false
    default: ro
  prompt-file:
    description: Prompt file for direct invocation. Required when model is set.
    required: false
    default: ""
  system-file:
    description: Optional system prompt file for direct invocation.
    required: false
    default: ""
  output:
    description: Result JSON path for direct invocation.
    required: false
    default: .opencode-evals/result.json
  mounts:
    description: Optional newline-separated SOURCE:TARGET[:ro|rw] extra mounts for direct invocation.
    required: false
    default: ""
  timeout-seconds:
    description: Model invocation timeout.
    required: false
    default: "240"
  container-timeout:
    description: Outer container timeout.
    required: false
    default: "300"
  command:
    description: Optional repository-owned eval command to execute after runner setup. Takes precedence over direct invocation inputs.
    required: false
    default: ""
  artifact-dir:
    description: Host directory for eval artifacts.
    required: false
    default: .opencode-evals

runs:
  using: composite
  steps:
    - name: Prepare eval runner
      shell: bash
      env:
        INPUT_OPENCODE_IMAGE: ${{ inputs.opencode-image }}
        INPUT_COPILOT_IMAGE: ${{ inputs.copilot-image }}
        INPUT_PREPARE_OPENCODE: ${{ inputs.prepare-opencode }}
        INPUT_PREPARE_COPILOT: ${{ inputs.prepare-copilot }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_BUILD: ${{ inputs.build }}
        INPUT_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
      run: |
        set -euo pipefail

        opencode_image="$INPUT_OPENCODE_IMAGE"
        copilot_image="$INPUT_COPILOT_IMAGE"

        if [[ "$INPUT_BUILD" == "true" ]]; then
          suffix="${GITHUB_RUN_ID:-dev}"
          opencode_image="opencode-eval-runner:opencode-local-$suffix"
          copilot_image="opencode-eval-runner:copilot-local-$suffix"
          if [[ "$INPUT_PREPARE_OPENCODE" == "true" ]]; then
            "$INPUT_ENGINE" build \
              -f "${{ github.action_path }}/Containerfile" \
              --target opencode \
              -t "$opencode_image" \
              "${{ github.action_path }}"
          fi
          if [[ "$INPUT_PREPARE_COPILOT" == "true" ]]; then
            "$INPUT_ENGINE" build \
              -f "${{ github.action_path }}/Containerfile" \
              --target copilot \
              -t "$copilot_image" \
              "${{ github.action_path }}"
          fi
        else
          if [[ "$INPUT_PREPARE_OPENCODE" == "true" ]]; then
            "$INPUT_ENGINE" pull "$opencode_image"
          fi
          if [[ "$INPUT_PREPARE_COPILOT" == "true" ]]; then
            "$INPUT_ENGINE" pull "$copilot_image"
          fi
        fi

        echo "${{ github.action_path }}/bin" >> "$GITHUB_PATH"
        echo "PYTHONPATH=${{ github.action_path }}${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
        echo "OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE=$opencode_image" >> "$GITHUB_ENV"
        echo "OPENCODE_EVAL_RUNNER_COPILOT_IMAGE=$copilot_image" >> "$GITHUB_ENV"
        echo "OPENCODE_EVAL_RUNNER_ENGINE=$INPUT_ENGINE" >> "$GITHUB_ENV"
        mkdir -p "$INPUT_ARTIFACT_DIR"

    - name: Run direct isolated eval
      if: ${{ inputs.command == '' && inputs.model != '' }}
      shell: bash
      env:
        # Action mode deliberately forces GitHub's ephemeral workflow token.
        # Copilot CLI prefers COPILOT_GITHUB_TOKEN and GH_TOKEN when present,
        # so neutralize inherited higher-precedence credentials.
        COPILOT_GITHUB_TOKEN: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_REASONING: ${{ inputs.reasoning }}
        INPUT_AGENT: ${{ inputs.agent }}
        INPUT_SKILL: ${{ inputs.skill }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_WORKSPACE_MODE: ${{ inputs.workspace-mode }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        INPUT_SYSTEM_FILE: ${{ inputs.system-file }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_MOUNTS: ${{ inputs.mounts }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_CONTAINER_TIMEOUT: ${{ inputs.container-timeout }}
      run: |
        set -euo pipefail
        if [[ -z "$INPUT_PROMPT_FILE" ]]; then
          echo "opencode-eval-runner action: prompt-file is required when model is set" >&2
          exit 2
        fi

        args=(
          opencode-eval-runner invoke
          --engine "$INPUT_ENGINE"
          --transport "$INPUT_TRANSPORT"
          --workspace "$INPUT_WORKSPACE"
          --workspace-mode "$INPUT_WORKSPACE_MODE"
          --model "$INPUT_MODEL"
          --prompt-file "$INPUT_PROMPT_FILE"
          --output "$INPUT_OUTPUT"
          --timeout-seconds "$INPUT_TIMEOUT_SECONDS"
          --container-timeout "$INPUT_CONTAINER_TIMEOUT"
        )
        [[ -n "$INPUT_REASONING" ]] && args+=(--reasoning "$INPUT_REASONING")
        [[ -n "$INPUT_AGENT" ]] && args+=(--agent "$INPUT_AGENT")
        [[ -n "$INPUT_SKILL" ]] && args+=(--skill "$INPUT_SKILL")
        [[ -n "$INPUT_SYSTEM_FILE" ]] && args+=(--system-file "$INPUT_SYSTEM_FILE")
        while IFS= read -r mount; do
          [[ -z "$mount" ]] && continue
          args+=(--mount "$mount")
        done <<< "$INPUT_MOUNTS"

        "${args[@]}"

    - name: Run repository eval command
      if: ${{ inputs.command != '' }}
      shell: bash
      env:
        # Repository-owned harnesses get the same deterministic auth contract.
        COPILOT_GITHUB_TOKEN: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ${{ github.token }}
        EVAL_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        bash -euo pipefail -c "$EVAL_COMMAND"
